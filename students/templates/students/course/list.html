{% extends "base.html" %}
{% block title %}Мои курсы{% endblock %}
{% block content %}
	<h1 class="header">Мои курсы</h1>
	<div class="module__list__student">
		{% for course in object_list %}
			<div class="course-info">
				<h3>{{ course.title }}</h3>
				<p><a href="{% url 'student_course_detail' course.id %}">Доступ к содержанию</a></p>
			</div>
			{% empty %}
			<p>Вы не записались на курсы. <a href="{% url 'course_list' %}">Обзор курсов</a></p>
		{% endfor %}
	</div>
{% endblock %}
